# Example environment for deploy/deploy.sh (copy to deploy/env.yaml).
# Paths must match your backend exactly: the relay never rewrites them.

# One route per entry: PATH_PREFIX=TARGET[,options]. Longest prefix wins.
#   http://host:port   HTTP/1.1, gRPC automatically as h2c (most Xray inbounds)
#   h2c://host:port    always HTTP/2 cleartext
#   https://host:port  TLS to the backend (h2 or HTTP/1.1)
#   tunnel://host:port authenticated WebSocket -> raw TCP (HTTP proxy, SSH, ...)
ROUTES: >-
  /grpcsvc/=http://203.0.113.10:80;
  /xh=http://203.0.113.10:8080;
  /ws=http://203.0.113.10:8880;
  /t/proxy=tunnel://203.0.113.10:3128

# Optional catch-all for every other path (same as a "/" route).
# DEFAULT_TARGET: "203.0.113.10:80"

# Tunnel tokens: prefer --set-secrets TUNNEL_TOKENS=<secret>:latest instead.
# TUNNEL_TOKENS: "replace-with-a-long-random-token"

LOG_LEVEL: "info"
LOG_REQUESTS: "false"
HEALTH_PATH: "/_mk/health"
DIAL_TIMEOUT: "10s"
WS_PING_INTERVAL: "25s"
